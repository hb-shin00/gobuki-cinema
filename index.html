<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fdfeff">
  <title>Lucky Seat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 입장 화면 "AI CX CINEMA DAY / LUCKY SEAT" 타이틀 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="#1b1e24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="#1b1e24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app">

  <!-- 1. 입장 -->
  <section class="screen scene" id="s-intro">
    <img class="scene-bg" src="assets/Intro_GraphicLayout.svg" alt="">
    <div class="heading">
      <img class="deco deco-tr" src="assets/img_colored_clover.svg" alt="">
      <p class="eyebrow">AI CX CINEMA DAY</p>
      <h1 class="logo">LUCKY <span>SEAT</span></h1>
    </div>
    <div class="stage">
      <div class="bubble hand">어떤 행운이 기다리고 있을까요?</div>
      <div class="hero">
        <img class="deco deco-l" src="assets/img_colored_clover.svg" alt="">
        <img class="deco deco-br" src="assets/img_colored_clover.svg" alt="">
        <img class="turtle" src="assets/turtle_trim.png" alt="인턴 고북희">
      </div>
    </div>
    <div class="bottom"></div>
    <div class="cta-wrap cta-fixed"><button class="cta hand" id="btn-start">시작하기</button></div>
  </section>

  <!-- 2. 참여 정보 입력 -->
  <section class="screen form-screen" id="s-form">
    <div class="topbar"><button class="back" data-go="intro" aria-label="뒤로"><svg><use href="#i-back"/></svg></button></div>
    <form class="form-body" id="join-form" novalidate autocomplete="off">
      <h1>좌석 정보를 알려주세요</h1>
      <p class="desc">럭키시트 추첨을 위한 정보를 입력해주세요</p>
      <div class="field">
        <label for="f-name">이름<i>*</i></label>
        <input class="input" id="f-name" placeholder="고북희" maxlength="20">
        <p class="help">실명을 입력해주세요</p>
      </div>
      <div class="field">
        <label for="f-team">팀<i>*</i></label>
        <input class="input" id="f-team" placeholder="코어디자인팀" maxlength="30">
        <p class="help">소속 팀명을 입력해주세요</p>
      </div>
      <div class="field">
        <label for="f-row">좌석<i>*</i></label>
        <div class="seat-row">
          <input class="input" id="f-row" placeholder="열(예: A)" maxlength="1" autocapitalize="characters">
          <input class="input" id="f-num" placeholder="번호(예: 12)" inputmode="numeric" maxlength="2">
        </div>
        <p class="help" id="seat-help" hidden></p>
      </div>
    </form>
    <div class="cta-wrap cta-fixed"><button class="cta hand" id="btn-submit" form="join-form">제출하기</button></div>
  </section>

  <!-- 3-1. 대기 -->
  <section class="screen scene" id="s-wait">
    <img class="scene-bg" src="assets/Intro_GraphicLayout.svg" alt="">
    <div class="heading">
      <h1 class="hand-title">잠시만 기다려주세요</h1>
      <p class="sub">게임이 시작되면 화면이 자동으로 넘어가요</p>
    </div>
    <div class="stage">
      <button class="bubble hand link" data-go="list">럭키 시트 상품 보기 <svg><use href="#i-chevron"/></svg></button>
      <button class="clover-btn" data-go="list" aria-label="럭키 시트 상품 보기"><img src="assets/btn_clover.svg" alt=""></button>
      <div class="hero front">
        <img class="turtle" src="assets/turtle_front_trim.png" alt="인턴 고북희">
      </div>
    </div>
    <div class="bottom">
      <div class="info-card" id="wait-card">
        <img class="ico" id="wait-ok" src="assets/img_colored_success.svg" alt="">
        <img class="ico" id="wait-watch" src="assets/img_colored_triangle_warning.svg" alt="" hidden>
        <div><strong id="wait-title"></strong><span id="wait-desc">참여가 완료되었어요!</span></div>
      </div>
    </div>
  </section>

  <!-- 3-2. 럭키 시트 상품 -->
  <section class="screen list-screen" id="s-list">
    <div class="topbar"><button class="back" data-go="back" aria-label="뒤로"><svg><use href="#i-back"/></svg></button></div>
    <div class="list-head">
      <h1>럭키 시트 상품이에요</h1>
      <p>쉬어가는 하루와 작은 행운을 준비했어요</p>
    </div>
    <div class="prize-grid" id="prize-grid"></div>
  </section>

  <!-- 4~5. 라운드: 긁기 → 결과 -->
  <section class="screen round-screen" id="s-round">
    <div class="round-body">
      <div class="round-badge" id="round-badge">ROUND 1</div>
      <p class="round-sub" id="round-sub">스크래치를 긁어 당첨 여부를 확인하세요</p>
      <div class="round-card">
        <p class="pname" id="round-name"></p>
        <div class="prize-img"><img id="round-img" alt=""></div>
      </div>
      <!-- 내 티켓: 위쪽 띠에 내 좌석, 아래를 긁으면 당첨/꽝 -->
      <div class="ticket" id="ticket">
        <div class="ticket-head" id="ticket-seat"></div>
        <div class="ticket-result" id="ticket-result"></div>
      </div>
      <div class="round-foot" id="round-foot"></div>
    </div>
  </section>

  <!-- 6. 종료 -->
  <section class="screen scene" id="s-end">
    <img class="scene-bg" src="assets/Intro_GraphicLayout.svg" alt="">
    <div class="heading">
      <img class="deco deco-tr" src="assets/img_colored_clover.svg" alt="">
      <h1 class="hand-title">Lucky Seat 끝!</h1>
      <p class="sub">함께 해주셔서 고마워요</p>
    </div>
    <div class="stage">
      <div class="bubble hand">오늘 하루 푹 쉬어가요!</div>
      <div class="hero">
        <img class="deco deco-l" src="assets/img_colored_clover.svg" alt="">
        <img class="deco deco-br" src="assets/img_colored_clover.svg" alt="">
        <img class="turtle" src="assets/turtle_trim.png" alt="인턴 고북희">
      </div>
    </div>
    <div class="bottom">
      <div class="info-card" id="end-card" hidden>
        <img class="ico" src="assets/img_colored_clover.svg" alt="">
        <div><strong id="end-title"></strong><span id="end-desc"></span></div>
      </div>
    </div>
  </section>

  <!-- 당첨 축하 꽃가루 -->
  <canvas class="confetti" id="confetti"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/scratch.js"></script>
<script src="js/app.js"></script>
</body>
</html>
